<!DOCTYPE html>

<html>

        <link rel="stylesheet" href="./../css/style.css">

    <body>
        <h1>Horari</h1>
            <h2 style="color: #0000FF;">Horari de classe del curs SMX B</h2>  
        
        <br>
        <button 
            style="background-color: #0000FF; color: #FFFFFF;"

        <br>
        <table border="1">
            
            <thead>
                <tr>  
                    <th></th>
                    <th class="diaSetmana">Dilluns</th>
                    <th class="diaSetmana">Dimarts</th>
                    <th class="diaSetmana">Dimecres</th>

                    <th class="diaSetmana">Divendres</th>
                </tr>
            </thead>
            <tbody> 
                <tr>
                    <th class="horaDia">8:00 - 9:00</th>
                    <td class="AW">AW</td>
                    <td rowspan="2" class="MME">MME</td>
                    <td rowspan="2" class="MME">MME</td>
                    <td rowspan="2" class="SOM">SOM</td>
                    <td rowspan="2" class="IPO2">IPO 2</td>
                </tr>
                <tr>
                    <th class="horaDia">9:00 - 10:00</th>
                    <td class="IPO1">IPO 1</td>
                </tr>
                <tr>
                    <th class="horaDia">10:00 - 11:00</th>
                    <td class="XL">XL</td>
                    <td class="M-OPTATIU2">M.OPTATIU 2</td>
                    <td class="XL">XL</td>
                    <td class="IPO1">IPO 1</td>
                    <td class="ANG">ANG</td>
                </tr>
                <tr>
                    <th class="horaDia">11:00 - 11:30</th>
                    <td colspan="5">PATI</td>
                </tr>
                <tr>
                    <th class="horaDia">11:30 - 12:30</th>
                    <td class="XL">XL</td>
                    <td class="M-OPTATIU2">M.OPTATIU 2</td>
                    <td rowspan="2" class="XL"> XL</td>
                    <td class="XL">XL</td>
                    <td class="ANG">ANG</td>
                </tr>
                <tr>
                    <th class="horaDia">12:30 - 13:30</th>
                    <td class="AO">AO</td>
                    <td class="SOM">SOM</td>
                    <td class="IPO1">IPO 1</td>
                    <td class="AW">AW</td>
                </tr>
                <tr>
                    <th class="horaDia">13:30 - 14:30</th>
                    <td></td>
                    <td class="AO">AO</td>
                    <td></td>
                    <td class="AO">AO</td>
                    <td class="TUTORIA">TUTORIA</td>
                </tr>
                
            </tbody>
        </table>
